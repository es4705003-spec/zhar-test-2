<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HopSpeak</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%20128%20128%22%3E%3Crect%20width%3D%22128%22%20height%3D%22128%22%20rx%3D%2228%22%20fill%3D%22%2314121a%22/%3E%3Cg%20transform%3D%22translate%2824%2024%29%20scale%281.25%29%22%3E%3Cmask%20id%3D%22m%22%20maskUnits%3D%22userSpaceOnUse%22%20x%3D%220%22%20y%3D%220%22%20width%3D%2264%22%20height%3D%2264%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20fill%3D%22%23fff%22/%3E%3Cpath%20d%3D%22M22%2018V36M40%2018V36M22%2031A9%209%200%200%201%2040%2031%22%20fill%3D%22none%22%20stroke%3D%22%23000%22%20stroke-width%3D%224.5%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22/%3E%3Ccircle%20cx%3D%2252%22%20cy%3D%2212%22%20r%3D%2210%22%20fill%3D%22%23000%22/%3E%3C/mask%3E%0A%3Cg%20mask%3D%22url%28%23m%29%22%3E%3Crect%20x%3D%226%22%20y%3D%228%22%20width%3D%2250%22%20height%3D%2238%22%20rx%3D%2214%22%20fill%3D%22%239b6bff%22/%3E%3Cpath%20d%3D%22M13%2042L11%2058L30%2044Z%22%20fill%3D%22%239b6bff%22/%3E%3C/g%3E%0A%3Ccircle%20cx%3D%2252%22%20cy%3D%2212%22%20r%3D%227%22%20fill%3D%22%23ff7cc8%22/%3E%3C/g%3E%3C/svg%3E">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone-width column. Tabs in a bar at the bottom (Каналы | Друзья | avatar circle = Профиль | Чаты | Настройки). A channel is a page with voice rooms and text chats; owners get a pencil to edit it. Rooms, chats, settings and editors open as full screens on top.
   Look: flat colours, no gradients or glows, one font family, hairline dividers instead of boxes. Four themes are set with data-theme on <html>; every colour below comes from a token. */
:root {
  color-scheme: dark;
  --bg: #150b09; --card: #221310; --card2: #2d1b17; --line: #3e2822;
  --fg: #fbefe6; --muted: #b59a8d;
  --main: #ff7a1a; --on-main: #1f0d04;
  --hi: #ffc933; --on-hi: #2a1c00;
  --danger: #e5372a; --danger-t: #ff9185; --ok: #7fd36b;
  --p1: #ff7a1a; --p2: #ffc933; --p3: #ff5a3c; --p4: #ffa94d; --p5: #f0572d; --p6: #ff8f6b; --on-p: #2b0b04;
  --font: "Golos Text", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --gx-l: max(16px, env(safe-area-inset-left, 0px));
  --gx-r: max(16px, env(safe-area-inset-right, 0px));
}
/* Лёд: white, light blue, blue */
:root[data-theme="ice"] {
  color-scheme: light;
  --bg: #f3f7fc; --card: #ffffff; --card2: #e3eefb; --line: #cddbec;
  --fg: #10253b; --muted: #52667c;
  --main: #1f6feb; --on-main: #ffffff;
  --hi: #1257c4; --on-hi: #ffffff;
  --danger: #d63a2f; --danger-t: #c0281e; --ok: #1b8a4c;
  --p1: #5aa0ff; --p2: #8cc4ff; --p3: #3f86f0; --p4: #a9d4ff; --p5: #7f9cf5; --p6: #5cc0e0; --on-p: #08203d;
}
/* Лес: green, brown, lime */
:root[data-theme="forest"] {
  --bg: #15120c; --card: #211c13; --card2: #2c251a; --line: #3d3424;
  --fg: #f1eddf; --muted: #aaa28b;
  --main: #7cc243; --on-main: #12200a;
  --hi: #c8f25a; --on-hi: #1c2606;
  --danger: #d9522b; --danger-t: #ff9a78; --ok: #9bdc6f;
  --p1: #7cc243; --p2: #c8f25a; --p3: #b0925f; --p4: #d6b983; --p5: #5fa84a; --p6: #b5d86a; --on-p: #17140a;
}
/* Сумерки: grey, purple, pink */
:root[data-theme="dusk"] {
  --bg: #16151b; --card: #211f28; --card2: #2c2a36; --line: #3b3946;
  --fg: #efedf6; --muted: #a09db2;
  --main: #9b6bff; --on-main: #14072e;
  --hi: #ff7cc8; --on-hi: #2b0a1d;
  --danger: #ee4d5a; --danger-t: #ff9aa2; --ok: #7fd8a0;
  --p1: #9b6bff; --p2: #ff7cc8; --p3: #b58cff; --p4: #ff9fd6; --p5: #8d97ff; --p6: #d89bff; --on-p: #170b2e;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: var(--font); font-size: 15px; line-height: 1.4;
  display: flex; justify-content: center; align-items: center;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input, textarea { font: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--hi); outline-offset: 2px; }
svg { display: block; flex: none; }

.phone {
  position: relative; width: 100%; height: 100%; height: 100dvh; max-width: 460px;
  display: flex; flex-direction: column; overflow: hidden;
  background: var(--bg); padding-left: var(--gx-l); padding-right: var(--gx-r);
}
@media (min-width: 600px) {
  body { padding: 16px; }
  .phone { max-height: 900px; height: 100%; border: 1px solid var(--line); border-radius: 16px; }
}
@media (max-width: 599px) { input, textarea, select { font-size: 16px !important; } }   /* iPhone не приближает страницу при вводе */
@media (hover: hover) {
  .scroll, .msgs { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .tb:hover, .row:hover, .frow:hover, .setrow:hover, .nrow:hover { background: color-mix(in srgb, var(--fg) 6%, transparent); }
}

.screen { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding-bottom: 18px; scrollbar-width: none; }
.scroll::-webkit-scrollbar { display: none; }

/* header */
.top { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 18px 0 12px; min-height: 72px; }
.top h1 { margin: 0; font-weight: 700; font-size: 24px; letter-spacing: -.01em; }
.hbtns { display: flex; align-items: center; gap: 4px; flex: none; }
.gear { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); flex: none; }
.gear:hover { color: var(--fg); background: var(--card2); }
.srow { display: flex; gap: 10px; align-items: center; padding: 0 0 8px; }
.sbar { flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-weight: 500; text-align: left; }
.sbar:hover { color: var(--fg); }
.plus { width: 44px; height: 44px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--main); color: var(--on-main); }
.plus:active { transform: scale(.94); }
.searchrow { display: flex; gap: 10px; align-items: center; padding: 18px 0 12px; min-height: 72px; }
.searchrow label { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 44px; padding: 0 14px; border-radius: 10px; background: var(--card); border: 1px solid var(--hi); color: var(--muted); }
.searchrow input { flex: 1; min-width: 0; background: none; border: 0; color: var(--fg); outline: none; }
.searchrow input::placeholder { color: var(--muted); }
.link-btn { color: var(--hi); font-weight: 600; padding: 8px 2px; }

.sect { font-size: 13px; font-weight: 600; color: var(--muted); padding: 18px 2px 6px; }

/* avatars */
.av { width: 44px; height: 44px; border-radius: 50%; flex: none; background: var(--c, var(--main)); color: var(--on-p); font-weight: 700; font-size: 17px; display: grid; place-items: center; position: relative; background-size: cover; background-position: center; }
.av.sm { width: 28px; height: 28px; font-size: 12px; }
.av.me { background-color: var(--c1, var(--main)); }
.stack { display: flex; }
.stack .av { box-shadow: 0 0 0 2px var(--bg); margin-left: -8px; }
.stack .av:first-child { margin-left: 0; }
.stack .more { width: 28px; height: 28px; border-radius: 50%; margin-left: -8px; background: var(--card2); color: var(--muted); font-size: 11px; font-weight: 600; display: grid; place-items: center; box-shadow: 0 0 0 2px var(--bg); }
.dot { position: absolute; right: -1px; bottom: -1px; width: 12px; height: 12px; border-radius: 50%; background: var(--ok); border: 2px solid var(--bg); }
.dot.off { background: var(--muted); }

/* channel list: plain rows with a hairline between them */
.card {
  width: 100%; display: flex; align-items: center; gap: 14px; text-align: left;
  padding: 12px 0; border-bottom: 1px solid var(--line);
}
.card:active { background: var(--card); }
.card.live { background: color-mix(in srgb, var(--hi) 9%, transparent); box-shadow: inset 3px 0 0 var(--hi); padding-left: 12px; }
.emblem {
  width: 52px; height: 52px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--c1, var(--main)); color: var(--on-p); font-weight: 700; font-size: 20px;
}
.card .info { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.card .nm { font-weight: 600; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 8px; }
.card .sub { color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 8px; min-width: 0; }
.card .sub span.tx { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.card.live .sub { color: var(--hi); }
.eq { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; flex: none; }
.eq i { width: 3px; height: 4px; border-radius: 1px; background: var(--hi); }
.eq.on i { animation: eq .8s ease-in-out infinite alternate; }
.eq.on i:nth-child(2) { animation-delay: -.3s; }
.eq.on i:nth-child(3) { animation-delay: -.6s; }
@keyframes eq { from { height: 3px; } to { height: 14px; } }
.join-sm { background: var(--main); color: var(--on-main); font-weight: 600; font-size: 13px; padding: 8px 14px; border-radius: 8px; flex: none; }
.joined-sm { color: var(--ok); font-weight: 600; font-size: 13px; flex: none; }

/* chat list */
.chips { display: flex; gap: 6px; padding: 0 0 10px; overflow-x: auto; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 32px; padding: 0 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); color: var(--muted); font-weight: 600; font-size: 13px; }
.chip[aria-pressed="true"] { background: var(--hi); border-color: var(--hi); color: var(--on-hi); }
.chip.sm { height: 30px; padding: 0 12px; font-size: 13px; }
.row { width: 100%; display: flex; align-items: center; gap: 14px; padding: 10px 0; text-align: left; border-bottom: 1px solid var(--line); }
.row:active { background: var(--card); }
.row .mid { flex: 1; min-width: 0; }
.row .nm { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.row .pv { color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row.unread .pv { color: var(--fg); font-weight: 500; }
.row .rt { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.badge { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: var(--main); color: var(--on-main); font-weight: 700; font-size: 12px; display: grid; place-items: center; flex: none; }
.tag { font-size: 11px; font-weight: 600; color: var(--hi); background: color-mix(in srgb, var(--hi) 14%, transparent); padding: 1px 6px; border-radius: 4px; flex: none; }
.write-btn { color: var(--hi); font-weight: 600; font-size: 13px; flex: none; }
.empty { padding: 36px 12px; text-align: center; color: var(--muted); }

/* sub screens */
.subtop { display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; min-height: 68px; }
.back { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.back:hover { background: var(--card2); }
.subtop .t { flex: 1; min-width: 0; }
.subtop .t b { display: block; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.subtop .t span { font-size: 12px; color: var(--muted); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* channel page */
.chan-hero { text-align: center; padding: 6px 0 4px; }
.chan-hero .emblem { width: 76px; height: 76px; border-radius: 16px; font-size: 30px; margin: 0 auto; }
.chan-hero h2 { margin: 12px 0 2px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.chan-hero .hd { margin: 0; color: var(--hi); font-weight: 600; }
.chan-hero .ds { margin: 8px auto 0; color: var(--muted); max-width: 34ch; overflow-wrap: anywhere; }
.chan-hero .meta { margin: 10px 0 0; display: flex; justify-content: center; gap: 6px; flex-wrap: wrap; }
.mchip { height: 26px; padding: 0 10px; border-radius: 6px; background: var(--card2); font-size: 12px; font-weight: 500; display: inline-flex; align-items: center; color: var(--muted); }
.join-hero { margin: 14px auto 0; display: inline-flex; align-items: center; height: 44px; padding: 0 26px; border-radius: 10px; background: var(--main); color: var(--on-main); font-weight: 700; }
.rrow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); text-align: left; }
.rrow:active { background: var(--card); }
.rrow.live { box-shadow: inset 3px 0 0 var(--hi); padding-left: 12px; background: color-mix(in srgb, var(--hi) 9%, transparent); }
.ri { width: 40px; height: 40px; border-radius: 10px; background: var(--card2); display: grid; place-items: center; color: var(--main); flex: none; }
.rrow.live .ri { color: var(--hi); }
.rrow .rm { flex: 1; min-width: 0; }
.rrow .rn { font-weight: 600; display: flex; align-items: center; gap: 6px; }
.rrow .rn svg { color: var(--muted); }
.rrow .rs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; }
.rrow .rs .tx { overflow: hidden; text-overflow: ellipsis; }
.rrow.live .rs { color: var(--hi); }
.rrow.unread .rs { color: var(--fg); font-weight: 500; }

/* voice room */
.room-hero { text-align: center; padding: 4px 0 8px; }
.room-hero .emblem { margin: 0 auto; }
.room-hero h2 { margin: 10px 0 2px; font-size: 22px; font-weight: 700; letter-spacing: -.01em; overflow-wrap: anywhere; }
.room-hero p { margin: 0; color: var(--muted); }
.lock-note { margin: 18px 0; padding: 22px 16px; text-align: center; border-radius: 12px; background: var(--card); border: 1px dashed var(--line); color: var(--muted); }
.lock-note svg { margin: 0 auto 10px; color: var(--hi); }
.lock-note b { display: block; color: var(--fg); margin-bottom: 4px; }
.grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px 10px; padding: 18px 0; }
.pt { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
.pt .ring { width: 84px; height: 84px; border-radius: 50%; padding: 4px; border: 3px solid transparent; transition: border-color .15s; }
.pt .ring .av { width: 100%; height: 100%; font-size: 30px; }
.pt.speaking .ring { border-color: var(--hi); }
.pt .pn { font-weight: 500; font-size: 13px; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; }
.pt .pn svg { color: var(--danger-t); }
.room-actions { padding: 8px 0 16px; display: flex; justify-content: center; align-items: center; gap: 14px; }
.big-join { display: inline-flex; align-items: center; gap: 10px; height: 52px; padding: 0 28px; border-radius: 12px; background: var(--main); color: var(--on-main); font-weight: 700; font-size: 16px; }
.rbtn { width: 56px; height: 56px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; }
.rbtn[aria-pressed="true"] { background: color-mix(in srgb, var(--danger) 22%, transparent); color: var(--danger-t); }
.rbtn.leave { background: var(--danger); color: #fff; width: 64px; height: 64px; }
.hint { text-align: center; color: var(--muted); font-size: 13px; padding: 0 12px; }

/* mini voice */
.mini {
  display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 14px; margin-bottom: 8px;
  background: var(--card2); border: 1px solid var(--line); border-radius: 12px;
}
.mini .mt { flex: 1; min-width: 0; text-align: left; }
.mini b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mini span { font-size: 12px; color: var(--hi); }
.mini .mb { width: 38px; height: 38px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; flex: none; }
.mini .mb[data-off="true"] { color: var(--danger-t); }
.mini .mb.lv { background: var(--danger); color: #fff; }

/* chat bubbles */
.msgs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; padding: 8px 0 10px; scrollbar-width: none; }
.msgs::-webkit-scrollbar { display: none; }
.b { max-width: 80%; padding: 8px 12px; border-radius: 12px; overflow-wrap: anywhere; }
.b time { display: block; font-size: 10.5px; opacity: .7; margin-top: 2px; text-align: right; font-variant-numeric: tabular-nums; }
.b.pend { opacity: .6; }
.tk { display: inline-block; margin-left: 4px; vertical-align: -1px; opacity: .55; }
.tk svg { width: 17px; height: 11px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.tk.rd { opacity: 1; }
.emblem.img { background-size: cover; background-position: center; color: transparent; }
.avrow { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; padding: 4px 0 8px; }
.avrow .tiny-btn { cursor: pointer; }
.qrow { display: flex; align-items: center; gap: 12px; width: 100%; margin: 8px 0 2px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; text-align: left; }
.qrow small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 2px; }
.qitem { border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin-top: 10px; background: var(--card); }
.qitem b { display: block; }
.qitem small { color: var(--muted); }
.qitem input { width: 100%; height: 40px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); padding: 0 10px; font: inherit; margin: 8px 0; }
.qitem .row { display: flex; gap: 8px; }
.qitem .row button, .qitem .row a { flex: 1; height: 40px; display: grid; place-items: center; border-radius: 10px; border: 1px solid var(--line); font-weight: 600; font-size: 14px; color: var(--fg); text-decoration: none; }
.qform select, .qform input { width: 100%; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); padding: 0 12px; font: inherit; margin-bottom: 8px; }
.leave-link { display: block; margin: 18px auto 8px; color: var(--muted); text-decoration: underline; font-size: 14px; }
.leave-link.ask { color: var(--danger-t); }
.b.them { align-self: flex-start; background: var(--card2); border-bottom-left-radius: 4px; }
.b.me { align-self: flex-end; background: var(--main); color: var(--on-main); border-bottom-right-radius: 4px; }
.tabbar .brand { display: none; }
.gm { display: flex; gap: 8px; align-items: flex-end; max-width: 88%; align-self: flex-start; margin-top: 4px; }
.gb { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.gn { display: block; font-size: 12.5px; font-weight: 700; line-height: 1.25; margin-bottom: 2px; overflow-wrap: anywhere; }
.gb .b { max-width: 100%; }
.compose { display: flex; gap: 8px; padding: 8px 0 14px; }
.compose input { flex: 1; min-width: 0; height: 46px; border-radius: 10px; padding: 0 14px; background: var(--card); border: 1px solid var(--line); color: var(--fg); }
.compose input::placeholder { color: var(--muted); }
.compose button { width: 46px; height: 46px; border-radius: 10px; background: var(--main); color: var(--on-main); display: grid; place-items: center; }
.lockbar { display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin: 8px 0 14px; border-radius: 10px; background: var(--card); color: var(--muted); font-size: 13px; }
.lockbar svg { color: var(--hi); }
.lockbar span { flex: 1; min-width: 0; }

/* profile */
.banner { position: relative; height: 140px; margin-top: 24px; border-radius: 14px; background-size: cover; background-position: center; overflow: hidden; flex: none; }
.glass {
  position: absolute; width: 40px; height: 40px; border-radius: 50%; z-index: 1;

}

.friends-h { display: flex; gap: 14px; overflow-x: auto; padding: 4px 0 6px; scrollbar-width: none; }

.fr { display: flex; flex-direction: column; align-items: center; gap: 6px; width: 62px; flex: none; font-size: 12px; font-weight: 500; }

.sdot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); }

/* forms: editors + settings */
.seg { display: flex; gap: 6px; flex-wrap: wrap; }

input[type="range"] { width: 100%; accent-color: var(--main); }

/* theme picker */
.themes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 4px 0 6px; }

/* channel editor */
.ed-emb { display: flex; justify-content: center; padding: 6px 0 4px; }

.redit .del { width: 40px; height: 40px; border-radius: 8px; display: grid; place-items: center; color: var(--danger-t); background: color-mix(in srgb, var(--danger) 14%, transparent); flex: none; }
.redit .setrow { margin: 0; }
.redit .cap { font-size: 13px; color: var(--muted); margin: 0 0 8px; font-weight: 500; }

.add-row { display: flex; gap: 10px; flex-wrap: wrap; padding-top: 2px; }
.add-btn { height: 42px; padding: 0 16px; border-radius: 10px; border: 1px dashed var(--muted); color: var(--hi); font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }

/* stage 1 additions */
.demo-tag { position: absolute; top: 4px; left: 50%; transform: translateX(-50%); z-index: 6; font-size: 11px; font-weight: 500; color: var(--muted); pointer-events: none; white-space: nowrap; }
.gear.bell { position: relative; }
.bdot { position: absolute; top: -2px; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--main); color: var(--on-main); font-size: 11px; font-weight: 700; display: grid; place-items: center; border: 2px solid var(--bg); }
.tabbar .tb svg { width: 24px; height: 24px; }
.hintbox { font-size: 13px; color: var(--muted); padding: 4px 2px 10px; }

.facts { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px 4px 10px 58px; }
.facts button { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-weight: 500; font-size: 13px; }
.facts button.dg { color: var(--danger-t); border-color: var(--danger); }
.rq { display: flex; align-items: center; gap: 12px; padding: 10px 0; }
.rq .btns { display: flex; gap: 6px; flex: none; }
.mini-y { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--main); color: var(--on-main); font-weight: 600; font-size: 13px; }
.mini-g { height: 32px; padding: 0 12px; border-radius: 8px; background: var(--card); border: 1px solid var(--line); font-weight: 500; font-size: 13px; }
.nrow { width: 100%; display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; text-align: left; border-bottom: 1px solid var(--line); }

.nrow .tx { overflow-wrap: anywhere; }
.nrow.unread .tx { font-weight: 600; }
.nrow .tm { font-size: 12px; color: var(--muted); }
.udot { width: 8px; height: 8px; border-radius: 50%; background: var(--main); flex: none; margin-top: 7px; }
.setrow.dis { opacity: .6; }
.row .ri { width: 44px; height: 44px; border-radius: 50%; }

/* tab bar: attached to the bottom edge */
.hmark { display:inline-block; width:28px; height:28px; margin-right:8px; vertical-align:-6px; }
.hmark svg { width:28px; height:28px; display:block; }
.tabbar.hide { display: none; }
.tabbar {
  display: grid; grid-template-columns: 1fr 1fr 84px 1fr 1fr; align-items: end;
  height: calc(60px + env(safe-area-inset-bottom, 0px)); margin: 4px calc(var(--gx-r) * -1) 0 calc(var(--gx-l) * -1); padding: 0 var(--gx-r) env(safe-area-inset-bottom, 0px) var(--gx-l);
  background: var(--card); border-top: 1px solid var(--line);
}

.tabbar .tb[aria-selected="true"] { color: var(--hi); }
.tabbar .tb .bdg { position: absolute; top: 6px; left: calc(50% + 8px); }

.tabbar .center { height: 60px; display: grid; place-items: center; }
.tabbar .center button {
  width: 68px; height: 68px; border-radius: 50%; margin-top: -22px; padding: 4px;
  background: var(--card); border: 1px solid var(--line);

.toast {
  position: absolute; left: 50%; bottom: 84px; transform: translate(-50%, 12px); z-index: 5;

  opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;

.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---- вход ---- */
.gate { position: absolute; inset: 0; z-index: 50; background: var(--bg); overflow-y: auto; padding: 28px max(20px, calc(50% - 210px)) 32px; display: none; }

  .tabbar, .tabbar.hide { display: flex !important; flex-direction: column; align-items: stretch; gap: 4px; grid-column: 1; grid-row: 1 / 3; height: auto; margin: 0; padding: 14px 12px; border-top: 0; border-right: 1px solid var(--line); background: var(--card); overflow-y: auto; }
  .tabbar .brand { order: -2; display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; padding: 6px 12px 16px; }

  .screen { grid-column: 2; grid-row: 1; width: 100%; max-width: 760px; margin: 0 auto; padding: 0 28px; }

  .demo-tag { left: calc(50% + 116px); }

}

  /* ---------- voice room ---------- */

  /* ---------- DMs ---------- */
  function chatRow(id) {
    var p = P[id], t = TH[id], last = t && t.msgs.length ? t.msgs[t.msgs.length - 1] : null;
    var pv = last ? (last.f === 'me' ? 'Вы: ' : '') + esc(last.t) : 'Пока нет сообщений';
    var right = t ? '<span class="rt"><span>' + (last ? esc(last.time) : '') + '</span>' + (t.unread ? '<span class="badge">' + t.unread + '</span>' : '') + '</span>' : '<span class="write-btn">Написать</span>';
    return '<button class="row' + (t && t.unread ? ' unread' : '') + '" data-thread="' + id + '"><span style="position:relative">' + avP(id) + '<span class="dot' + (p.on ? '' : ' off') + '"></span></span><span class="mid"><span class="nm">' + esc(p.n) + (p.friend ? '' : '<span class="tag">не в друзьях</span>') + '</span><span class="pv" style="display:block">' + pv + '</span></span>' + right + '</button>';

  function dmRows() {
    var ids = ORDER.filter(function (k) { return S.blocked.indexOf(k) < 0; });

  }
  function groupAv(g) { return '<span class="av" style="--c:var(--p4)">' + esc(g.name.charAt(0)) + '</span>'; }
  function groupRows() {
    var h = '';
    GROUPS.forEach(function (g) {
      var last = g.msgs[g.msgs.length - 1], pv = last ? (last.u === 'me' ? 'Вы' : P[last.u].n) + ': ' + last.t : 'Пока нет сообщений';
      h += '<button class="row' + (g.unread ? ' unread' : '') + '" data-group="' + g.id + '">' + groupAv(g) + '<span class="mid"><span class="nm">' + esc(g.name) + '<span class="tag">демо-группа</span></span><span class="pv" style="display:block">' + esc(pv) + '</span></span><span class="rt"><span>' + (last ? esc(last.time) : '') + '</span>' + (g.unread ? '<span class="badge">' + g.unread + '</span>' : '') + '</span></button>';

        var last = r.msgs[r.msgs.length - 1], pv = last ? (last.u === 'me' ? 'Вы' : P[last.u].n) + ': ' + last.t : 'Пока нет сообщений';

  function screenChats() {

  /* ---------- настоящие друзья (Supabase) ---------- */
  var REAL = { byId: {}, sig: '' };

  function setSocial(d) {
    Object.keys(P).forEach(function (k) { if (P[k].real) delete P[k]; else P[k].friend = false; });
    REAL.byId = {};
    (d.people || []).forEach(function (pp) {

      P[k] = { n: pp.name, c: COLORS[(pp.g || 0) % 5][0], nick: pp.nick || '', id: pp.id, real: true, on: false, st: pp.status, friend: false };
    });

    FRIENDS.length = 0;
    (d.friends || []).map(key).filter(ok).forEach(function (k) { FRIENDS.push(k); P[k].friend = true; });
    S.req.in = (d.reqIn || []).map(key).filter(ok);
    S.req.out = (d.reqOut || []).map(key).filter(ok);
    S.blocked = (d.blocked || []).map(key).filter(ok);

  var ADDTXT = { sent: 'Заявка отправлена @', accepted: 'Вы теперь друзья с @', pending: 'Заявка уже отправлена @', already: '@' };
  function addFriendByNick(raw) {
    var nick = raw.trim().toLowerCase().replace(/^@/, '').replace(/[^a-z0-9_]/g, '');
    var err = function (t) { S.addMsg = { err: true, t: t }; S.addVal = raw; render(); };

  function fmtTime(iso) {
    var d = new Date(iso), n = new Date();
    if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
    return d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
  }
  function applyDms(list) {

      var k = REAL.byId[c.peer]; if (!k) return;
      TH[k] = { chatId: c.chatId, lastId: c.lastId, unread: c.unread, peerRead: c.peerRead || 0, msgs: c.msgs.map(function (m) { return { id: m.id, f: m.mine ? 'me' : 'them', t: m.body, time: fmtTime(m.at) }; }) };

  function openRealThread(id) {

  function sendReal(id, v, inp) {

    report: function (id, reason) { return wrap(function () { return db.rpc('report_user', { p_target: id, p_reason: reason, p_details: '' }); }); },
    saveProfile: async function (d, registered) {
      var me = await myId(), row = { name: (d.name || '').trim().slice(0, 30), bio: d.bio || '', status: d.status, avatar_color: d.g, banner_color: d.b };
      if (registered && d.nick) row.nick = d.nick.toLowerCase();
      return wrap(function () { return db.from('profiles').update(row).eq('id', me); });
    },
    savePrivacy: async function (key, val) {
      var col = { reqFrom: 'privacy_requests', writes: 'privacy_dm', invites: 'privacy_invites' }[key]; if (!col) return { ok: true };
      var me = await myId(), row = {}; row[col] = val;
      return wrap(function () { return db.from('profiles').update(row).eq('id', me); });
    }
  };

  window.HSAuth = {
    logout: async function () { try { if (rtCh) { db.removeChannel(rtCh); rtCh = null; } await db.auth.signOut(); } catch (e) {} if (window.HSApp) HSApp.setUser(null); mode = 'guest'; form = { name: '', email: '', pass: '', ok: false, nick: '' }; showGate(true); },
    deleteAccount: async function () {
      try {
        var r = await db.rpc('delete_my_account');
        if (r.error) {
          if (/owns channels/i.test(r.error.message)) return { ok: false, msg: 'Вы владелец канала. Сначала удалите канал или передайте его.' };
          return { ok: false, msg: 'Не удалось удалить: ' + r.error.message };
        }
      } catch (e) { return { ok: false, msg: 'Нет связи с сервером. Попробуйте позже.' }; }
      try { await db.auth.signOut({ scope: 'local' }); } catch (e) {}
      try { localStorage.removeItem('zhar.v2'); localStorage.removeItem('hs.consent'); } catch (e) {}
      if (window.HSApp) HSApp.setUser(null); mode = 'guest'; form = { name: '', email: '', pass: '', ok: false, nick: '' }; showGate(true);
      return { ok: true };
    }
  };

  document.addEventListener('click', function (e) {
    var b = e.target.closest('#gate button'); if (!b) return;
    if (b.dataset.gm) { mode = b.dataset.gm; say(''); drawGate(); }
    else if (b.id === 'gGo') submit();
    else if (b.id === 'gNick') saveNick();
    else if (b.id === 'gOut') HSAuth.logout();
  });
  document.addEventListener('input', function (e) {
    var id = e.target.id;
    if (id === 'gNickIn') { var nv = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); e.target.value = nv; form.nick = nv; }
    else if (id === 'gName') form.name = e.target.value;
    else if (id === 'gEmail') form.email = e.target.value;
    else if (id === 'gPass') form.pass = e.target.value;
    else if (id === 'gOk') form.ok = e.target.checked; else return;
    upd();
  });
  document.addEventListener('change', function (e) { if (e.target.id === 'gOk') { form.ok = e.target.checked; upd(); } });

  if (!window.supabase) { showGate(true); say('Не загрузилась библиотека входа. Проверьте интернет или отключите VPN.', true); return; }
  db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  db.auth.onAuthStateChange(function (ev) { if (ev === 'SIGNED_OUT') { if (window.HSApp) HSApp.setUser(null); showGate(true); } });
  db.auth.getSession().then(function (r) { if (r.data && r.data.session) afterSignIn(); else showGate(true); }).catch(function () { showGate(true); });
  gateEl().classList.add('on');   // пока проверяем сессию, приложение закрыто
})();
</script>
</body>
</html>
